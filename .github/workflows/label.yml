name: Label

# pull_request_target, so pull requests from forks can be labeled too. It runs
# this file from main and never checks out the pull request's code.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
