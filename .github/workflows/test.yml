name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A pull request from a fork runs without secrets and can't change the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in the job needs the token, so the dependencies can't read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
